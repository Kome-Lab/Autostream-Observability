services:
  observability:
    image: ${AUTOSTREAM_IMAGE_REGISTRY:-ghcr.io/kome-lab/autostream-docker}/observability:${AUTOSTREAM_DOCKER_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AUTOSTREAM_NODE_CONFIG: /etc/autostream-observability/config.yml
      AUTOSTREAM_CONFIG_REVISION: ${AUTOSTREAM_CONFIG_REVISION:-1}
      OBSERVABILITY_BIND_ADDR: 0.0.0.0:${AUTOSTREAM_OBSERVABILITY_CONTAINER_PORT:-8080}
    ports: !override
      - "127.0.0.1:${AUTOSTREAM_OBSERVABILITY_PORT:-8082}:${AUTOSTREAM_OBSERVABILITY_CONTAINER_PORT:-8080}"
    volumes:
      - ${OBSERVABILITY_NODE_CONFIG_PATH:-./config/config.yml}:/etc/autostream-observability/config.yml:ro
