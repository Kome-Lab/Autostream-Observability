services:
  observability:
    build: .
    env_file: .env.example
    environment:
      AUTOSTREAM_NODE_CONFIG: /etc/autostream-observability/config.yml
      CREDENTIALS_DIRECTORY: /run/autostream-credentials
    configs:
      - source: node-listener
        target: /run/autostream-credentials/node-listener.json
    ports:
      - "127.0.0.1:${AUTOSTREAM_OBSERVABILITY_PORT:-8082}:${AUTOSTREAM_OBSERVABILITY_CONTAINER_PORT:-8080}"
    volumes:
      - ./config/config.yml:/etc/autostream-observability/config.yml:ro
    depends_on:
      - mariadb
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: autostream_observability
      MARIADB_USER: autostream
      MARIADB_PASSWORD: example_password_change_me
      MARIADB_ROOT_PASSWORD: example_root_password_change_me
    volumes:
      - mariadb:/var/lib/mysql
volumes:
  mariadb:

configs:
  node-listener:
    content: |
      {"schema_version":2,"service_type":"observability","bind_address":"0.0.0.0:${AUTOSTREAM_OBSERVABILITY_CONTAINER_PORT:-8080}","config_revision":${AUTOSTREAM_CONFIG_REVISION:?AUTOSTREAM_CONFIG_REVISION is required}}
