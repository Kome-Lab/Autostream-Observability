name: autostream-observability CI

on:
  push:
    branches: [main, codex/bundle8b-physical-eol-001]
  pull_request:

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: autostream_observability
          MARIADB_USER: autostream
          MARIADB_PASSWORD: autostream_password
          MARIADB_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check service installer syntax
        run: |
          bash -n release/install-autostream-observability
          bash -n release/test-install-autostream-observability-integration.sh
      - name: Test managed service installer with root-owned Linux fixtures
        run: sudo bash release/test-install-autostream-observability-integration.sh
      - name: Test SMTP interruption recovery in a fresh database per parent
        timeout-minutes: 10
        shell: bash
        env:
          AUTOSTREAM_MARIADB_CI_CONTAINER: ${{ job.services.mariadb.id }}
          AUTOSTREAM_MARIADB_CI_ROOT_PASSWORD: root_password
        run: bash scripts/ci/test-notification-v2-resume.sh
      - name: Upload SMTP recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notification-v2-resume-${{ github.sha }}
          path: ${{ runner.temp }}/notification-v2-resume/
          if-no-files-found: error
          retention-days: 14
      - name: Rehearse v2 SMTP physical EOL with retained backup
        run: go test ./internal/database -run TestMariaDBNotificationChannelV2PhysicalEOL -count=1
        env:
          AUTOSTREAM_OBSERVABILITY_TEST_DATABASE_URL: autostream:autostream_password@tcp(127.0.0.1:3306)/autostream_observability?parseTime=true
      - name: Verify MariaDB webhook secret storage and global SMTP reference
        shell: bash
        run: |
          set -euo pipefail
          proof="$(mktemp)"
          trap 'rm -f "$proof"' EXIT
          go test -json ./internal/store -run '^TestMariaDBNotificationChannelIntegrationStoresWebhookSecretAndGlobalSMTPReference$' -count=1 | tee "$proof"
          if ! grep -Eq '"Action":"run".*"Test":"TestMariaDBNotificationChannelIntegrationStoresWebhookSecretAndGlobalSMTPReference"' "$proof"; then
            echo "zero MariaDB webhook secret storage tests ran" >&2
            exit 1
          fi
          if grep -Eq '"Action":"skip".*"Test":"TestMariaDBNotificationChannelIntegrationStoresWebhookSecretAndGlobalSMTPReference"' "$proof"; then
            echo "MariaDB webhook secret storage proof was skipped" >&2
            exit 1
          fi
          if ! grep -Eq '"Action":"pass".*"Test":"TestMariaDBNotificationChannelIntegrationStoresWebhookSecretAndGlobalSMTPReference"' "$proof"; then
            echo "MariaDB webhook secret storage proof did not pass" >&2
            exit 1
          fi
        env:
          AUTOSTREAM_OBSERVABILITY_TEST_DATABASE_URL: autostream:autostream_password@tcp(127.0.0.1:3306)/autostream_observability?parseTime=true
      - run: go test ./...
      - name: Test backup script with root-owned Linux fixtures
        run: |
          docker run --rm \
            --user 0:0 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-backup-script-root-smoke.sh \
              /workspace/release/autostream-backup-observability.example \
              /var/backups/autostream/observability \
              autostream_observability \
              autostream-kometubu_o11y
      - run: go build ./...
